name: Production Deployment

on:
  push:
    branches:
      - feature/v3.1-production

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        run: |
          # Run available tests
          python test_direct.py

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/v3.1-production'
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate Deployment Credentials
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ] || [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "Error: SSH credentials missing. Failing closed."
            exit 1
          fi

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ~/solbot-production
            git pull origin feature/v3.1-production
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Restart Service (Systemd preferred, tmux fallback)
            if systemctl is-active --quiet solbot; then
              sudo systemctl restart solbot
            else
              tmux kill-session -t solbot || true
              tmux new-session -d -s solbot 'source venv/bin/activate && python main.py'
            fi
            
            # Health Check
            python scripts/health_check.py http://localhost:8080/health

      - name: Notify Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Deployment Status: ${{ job.status }}
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Action: https://github.com/{{ github.repository }}/actions/runs/${{ github.run_id }}
