name: Production Deployment

on:
  push:
    branches:
      - feature/v3.1-production
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run Tests
        run: |
          # Run available tests
          if [ -f test_direct.py ]; then python test_direct.py; else echo "No tests found"; fi

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/v3.1-production'
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate Deployment Credentials
        run: |
          if [ -z "${{ secrets.VPS_PASSWORD }}" ] || [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "Error: SSH credentials missing. Failing closed."
            exit 1
          fi

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            
            # Ensure target directory exists and is a git repo
            if [ ! -d "$HOME/solbot-production/.git" ]; then
              echo "Initializing production directory..."
              mkdir -p $HOME/solbot-production
              cd $HOME/solbot-production
              git init
              git remote add origin https://github.com/${{ github.repository }}.git || true
              git fetch origin feature/v3.1-production
              git checkout -f feature/v3.1-production
            else
              cd $HOME/solbot-production
              git fetch origin feature/v3.1-production
              git checkout -f feature/v3.1-production
            fi
            
            # Setup Virtual Environment if missing
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            source venv/bin/activate
            pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            
            # Restart Service (Systemd preferred, tmux fallback)
            if systemctl is-active --quiet solbot; then
              sudo systemctl restart solbot
            else
              tmux kill-session -t solbot || true
              tmux new-session -d -s solbot 'source venv/bin/activate && python main.py'
            fi
            
            # Health Check
            if [ -f scripts/health_check.py ]; then
              python scripts/health_check.py
            else
              echo "Health check script not found, skipping."
            fi

      - name: Notify Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Deployment Status: ${{ job.status }}
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Action: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
